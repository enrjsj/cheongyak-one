spring:
  datasource:
    url: jdbc:h2:mem:cheongyak-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always

app:
  member-mail:
    delivery: log
    verification-required: true
    frontend-base-url: http://localhost:5173
  notice-sync:
    cron: "-"
    zone: Asia/Seoul
  member-notification:
    cron: "-"
    email-cron: "-"
    cleanup-cron: "-"
    zone: Asia/Seoul
