spring:
  datasource:
    # 로컬 H2도 PostgreSQL 호환 모드로 실행해 SQL 차이를 조기에 발견한다.
    url: jdbc:h2:mem:cheongyak;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always

app:
  notice-sync:
    cron: "-"

management:
  health:
    # 로컬 기본 설정에는 SMTP 자격정보가 없으므로 전체 readiness를 메일 연결 상태에 종속시키지 않는다.
    mail:
      enabled: false
