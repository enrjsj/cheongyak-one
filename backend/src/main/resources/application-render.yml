# Render + Supabase 공개 테스트 프로필. 실제 값은 Render 환경변수에서만 주입한다.
server:
  port: ${PORT:8080}

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 840000
      keepalive-time: 300000
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # 공개 테스트에서는 SMTP를 구성하지 않는다. Spring Mail 자동 헬스체크가
    # Render의 서비스 헬스체크를 DOWN으로 만들지 않도록 제외한다.
    mail:
      enabled: false

app:
  notice-sync:
    # Render Free 인스턴스는 유휴 상태에서 멈춰 정기 스케줄 실행을 보장할 수 없다.
    # 첫 배포 직후 빈 공고 목록이 노출되지 않도록 기동 시 한 번 수집하되,
    # 장애 대응 시 NOTICE_SYNC_RUN_ON_STARTUP=false로 즉시 비활성화할 수 있다.
    run-on-startup: ${NOTICE_SYNC_RUN_ON_STARTUP:true}
  auth:
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    # Vercel과 Render가 서로 다른 도메인이므로 브라우저 로그인 테스트에는 None이 필요하다.
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:None}
  member-mail:
    delivery: ${MEMBER_MAIL_DELIVERY:disabled}
    verification-required: ${MEMBER_EMAIL_VERIFICATION_REQUIRED:false}
