# Render + Supabase 공개 테스트 프로필. 실제 값은 Render 환경변수에서만 주입한다.
server:
  port: ${PORT:8080}

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      # Render Free의 첫 기동에는 웹 요청 전까지 유휴 연결을 만들 필요가 없다.
      # Flyway/JPA가 필요한 연결만 먼저 열고, 나머지는 실제 트래픽 때 확장한다.
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 840000
      keepalive-time: 300000
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # 공개 테스트에서는 SMTP를 구성하지 않는다. Spring Mail 자동 헬스체크가
    # Render의 서비스 헬스체크를 DOWN으로 만들지 않도록 제외한다.
    mail:
      enabled: false

app:
  notice-sync:
    # 공고 전체 수집(특히 주택형·분양가 보강)은 외부 API를 여러 번 호출하므로
    # Render Free의 콜드 스타트 경로에서는 실행하지 않는다. 일일 동기화는 GitHub
    # Actions의 예약 요청과 관리자의 수동 실행으로 처리한다. 긴급하게 필요할 때만
    # Render 환경변수 NOTICE_SYNC_RUN_ON_STARTUP=true를 명시적으로 설정한다.
    run-on-startup: ${NOTICE_SYNC_RUN_ON_STARTUP:false}
  auth:
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    # Vercel과 Render가 서로 다른 도메인이므로 브라우저 로그인 테스트에는 None이 필요하다.
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:None}
  member-mail:
    delivery: ${MEMBER_MAIL_DELIVERY:disabled}
    verification-required: ${MEMBER_EMAIL_VERIFICATION_REQUIRED:false}
