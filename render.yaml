services:
  - type: web
    name: cheongyak-one-api
    # Render Blueprint는 Java native runtime을 제공하지 않아 Docker로 Java 21을 실행한다.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REB_API_KEY
        sync: false
      - key: MYHOME_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_SECURE_COOKIE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: "None"
      - key: MEMBER_MAIL_DELIVERY
        value: "disabled"
      - key: MEMBER_EMAIL_VERIFICATION_REQUIRED
        value: "false"
      # 외부 청약 API 전체 동기화는 수 분 이상 걸릴 수 있어 Render Free의 콜드
      # 스타트를 막지 않는다. 일일 GitHub Actions 동기화와 관리자 수동 실행을 사용한다.
      - key: NOTICE_SYNC_RUN_ON_STARTUP
        value: "false"
      # GitHub Actions 예약 동기화는 키를 등록하고 enabled를 true로 바꾼 뒤에만 활성화한다.
      - key: SCHEDULED_NOTICE_SYNC_ENABLED
        value: "false"
      - key: SCHEDULED_NOTICE_SYNC_API_KEY
        sync: false
