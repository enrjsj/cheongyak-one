services:
  - type: web
    name: cheongyak-one-api
    # Render Blueprint는 Java native runtime을 제공하지 않아 Docker로 Java 21을 실행한다.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REB_API_KEY
        sync: false
      - key: MYHOME_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_SECURE_COOKIE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: "None"
      - key: MEMBER_MAIL_DELIVERY
        value: "disabled"
      - key: MEMBER_EMAIL_VERIFICATION_REQUIRED
        value: "false"
