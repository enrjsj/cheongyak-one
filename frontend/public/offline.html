<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>청약한눈 | 연결 확인</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f7fa; color: #132744; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      main { width: min(100%, 420px); padding: 38px 30px; text-align: center; border: 1px solid #e1e7ee; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(19,39,68,.1); }
      img { width: 58px; height: 58px; margin-bottom: 16px; border-radius: 15px; }
      h1 { margin: 0; font-size: 23px; letter-spacing: -.04em; }
      p { margin: 13px 0 24px; color: #687587; font-size: 14px; line-height: 1.7; }
      button { height: 44px; padding: 0 17px; border: 0; border-radius: 10px; background: #356af4; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo.png" alt="청약한눈" />
      <h1>인터넷 연결을 확인해주세요</h1>
      <p>연결되면 최신 청약 공고를 다시 불러올 수 있어요.</p>
      <button type="button" onclick="window.location.reload()">다시 시도</button>
    </main>
  </body>
</html>
