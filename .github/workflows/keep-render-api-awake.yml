name: Keep Render API awake

on:
  # Render Free 인스턴스의 15분 유휴 중지를 피한다. GitHub cron은 지연될 수 있으므로
  # 실제 공고 동기화와 분리해 가벼운 health endpoint만 호출한다.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-api-awake
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_API_BASE_URL: ${{ secrets.RENDER_API_BASE_URL }}
    steps:
      - name: Request API health endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_BASE_URL"

          # 첫 호출은 이미 sleep 상태인 인스턴스의 기동을 기다릴 수 있다.
          # 재시도는 일시적인 Render 네트워크 오류만 흡수하며, 실패는 Actions에서 바로 확인한다.
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 150 \
            "${RENDER_API_BASE_URL%/}/actuator/health"
