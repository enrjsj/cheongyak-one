name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -pl backend test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cheongyak
          POSTGRES_USER: cheongyak
          POSTGRES_PASSWORD: cheongyak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cheongyak -d cheongyak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/cheongyak
      POSTGRES_TEST_USERNAME: cheongyak
      POSTGRES_TEST_PASSWORD: cheongyak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Validate Flyway and JPA against PostgreSQL
        run: mvn -B -pl backend -Dtest=PostgresMigrationIntegrationTest test

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CloudFormation validator
        run: pip install cfn-lint
      - name: Validate CloudFormation and deployment scripts
        run: |
          cfn-lint infra/aws/*.yml
          bash -n scripts/*.sh

  real-data:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REB_API_KEY: ${{ secrets.REB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Validate REB secret
        run: test -n "$REB_API_KEY"
      - name: Build executable JAR
        run: mvn -B -pl backend -DskipTests package
      - name: Start API with real-data synchronization
        run: |
          java -jar backend/target/cheongyak-one-backend-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=local \
            --app.notice-sync.run-on-startup=true \
            --app.notice-sync.export-path=backend/target/reb-sample.json \
            > backend/target/real-data-api.log 2>&1 &
          echo $! > backend/target/real-data-api.pid
      - name: Smoke test real-data REST API
        run: |
          set -euo pipefail

          # API 오류가 발생하면 HTTP 응답과 서버 로그를 함께 남겨 원인을 바로 확인한다.
          request_api() {
            local url="$1"
            local output="$2"
            local status

            status="$(curl --silent --show-error --output "$output" \
              --write-out '%{http_code}' "$url")"
            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              echo "API request failed: ${status} ${url}"
              cat "$output"
              cat backend/target/real-data-api.log
              return 1
            fi
          }

          for attempt in {1..60}; do
            if ! kill -0 "$(cat backend/target/real-data-api.pid)" 2>/dev/null; then
              cat backend/target/real-data-api.log
              exit 1
            fi
            if test -s backend/target/reb-sample.json \
              && curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              break
            fi
            if test "$attempt" = 60; then
              cat backend/target/real-data-api.log
              exit 1
            fi
            sleep 2
          done

          request_api \
            'http://localhost:8080/api/v1/notices?page=0&size=10' \
            backend/target/notice-page.json
          jq -e '.totalElements > 0 and (.content | length) > 0' \
            backend/target/notice-page.json
          jq -e '.content[0].sourceSystem != null and .content[0].syncedAt != null' \
            backend/target/notice-page.json

          notice_id="$(jq -r '.content[0].id' backend/target/notice-page.json)"
          request_api \
            "http://localhost:8080/api/v1/notices/${notice_id}" \
            backend/target/notice-detail.json
          jq -e --argjson notice_id "$notice_id" \
            '.id == $notice_id and .officialUrl != null' \
            backend/target/notice-detail.json
      - name: Print public-data summary
        run: >-
          jq '{generatedAt, fetchedCount, savedCount, totalInDatabase,
          categories: (.notices | group_by(.category) | map({category: .[0].category, count: length}))}'
          backend/target/reb-sample.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reb-real-data-sample
          path: |
            backend/target/reb-sample.json
            backend/target/notice-page.json
            backend/target/notice-detail.json
            backend/target/real-data-api.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop real-data API
        if: always()
        run: |
          if test -f backend/target/real-data-api.pid; then
            kill "$(cat backend/target/real-data-api.pid)" 2>/dev/null || true
          fi
