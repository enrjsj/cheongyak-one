AWSTemplateFormatVersion: "2010-09-09"
Description: Low-cost Elastic Beanstalk and private RDS PostgreSQL platform for Cheongyak One

Parameters:
  ProjectName:
    Type: String
    Default: cheongyak-one
    AllowedPattern: "[a-z][a-z0-9-]{2,31}"
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  BeanstalkSolutionStackName:
    Type: String
    Description: Current Corretto 21 on Amazon Linux 2023 solution stack name
  DatabaseName:
    Type: String
    Default: cheongyak
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,62}"
  DatabaseUsername:
    Type: String
    Default: cheongyak_app
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,62}"
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  ApplicationInstanceType:
    Type: String
    Default: t3.micro
  DatabaseDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  RebApiSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN containing the raw REB API key

Conditions:
  HasRebApiSecret: !Not [!Equals [!Ref RebApiSecretArn, ""]]
  ProtectDatabase: !Equals [!Ref DatabaseDeletionProtection, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.24.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  ApplicationSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.24.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-application

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.24.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database-a

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.24.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  ApplicationSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ApplicationSubnet
      RouteTableId: !Ref PublicRouteTable

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Elastic Beanstalk application access
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # CloudFront는 고정 보안 그룹을 제공하지 않으므로 앱 포트만 공개한다.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-application

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access from the application only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Cheongyak One PostgreSQL
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub ${ProjectName} RDS credentials
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      # 리전에서 신규 생성 가능한 최신 기본 마이너 버전을 AWS가 선택한다.
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: "20"
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      PreferredBackupWindow: 17:00-17:30
      PreferredMaintenanceWindow: Sun:19:00-Sun:19:30
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: !If [ProtectDatabase, true, false]
      EnablePerformanceInsights: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}

  DeploymentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldApplicationBundles
            Status: Enabled
            ExpirationInDays: 30
      VersioningConfiguration:
        Status: Enabled

  BeanstalkServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticbeanstalk.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkManagedUpdatesCustomerRolePolicy

  ApplicationInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadBeanstalkBundleAndWriteLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}/*
                  - !Sub ${DeploymentBucket.Arn}/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/elasticbeanstalk/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret
              - !If
                - HasRebApiSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref RebApiSecretArn
                - !Ref AWS::NoValue

  ApplicationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ApplicationInstanceRole

  BeanstalkApplication:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Ref ProjectName
      Description: Cheongyak One Spring Boot API

  BeanstalkEnvironment:
    Type: AWS::ElasticBeanstalk::Environment
    DependsOn: VpcGatewayAttachment
    Properties:
      ApplicationName: !Ref BeanstalkApplication
      EnvironmentName: !Sub ${ProjectName}-${EnvironmentName}
      SolutionStackName: !Ref BeanstalkSolutionStackName
      Tier:
        Name: WebServer
        Type: Standard
      OptionSettings:
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: EnvironmentType
          Value: SingleInstance
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: ServiceRole
          Value: !Ref BeanstalkServiceRole
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref ApplicationInstanceProfile
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: !Ref ApplicationInstanceType
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: SecurityGroups
          Value: !Ref ApplicationSecurityGroup
        - Namespace: aws:ec2:vpc
          OptionName: VPCId
          Value: !Ref Vpc
        - Namespace: aws:ec2:vpc
          OptionName: Subnets
          Value: !Ref ApplicationSubnet
        - Namespace: aws:ec2:vpc
          OptionName: AssociatePublicIpAddress
          Value: "true"
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: DB_URL
          Value: !Sub jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DatabaseName}?sslmode=require
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: DB_USERNAME
          Value: !Ref DatabaseUsername
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: SPRING_PROFILES_ACTIVE
          Value: aws
        - Namespace: aws:elasticbeanstalk:healthreporting:system
          OptionName: SystemType
          Value: enhanced
        - Namespace: aws:elasticbeanstalk:managedactions
          OptionName: ManagedActionsEnabled
          Value: "true"
        - Namespace: aws:elasticbeanstalk:managedactions
          OptionName: PreferredStartTime
          Value: Sun:18:00
        - Namespace: aws:elasticbeanstalk:managedactions:platformupdate
          OptionName: UpdateLevel
          Value: minor
        - Namespace: aws:elasticbeanstalk:managedactions:platformupdate
          OptionName: InstanceRefreshEnabled
          Value: "true"
        - Namespace: aws:elasticbeanstalk:command
          OptionName: DeploymentPolicy
          Value: AllAtOnce
        - !If
          # Beanstalk가 실행 시점에 비밀번호를 조회하므로 구성 화면에 원문이 남지 않는다.
          - HasRebApiSecret
          - Namespace: aws:elasticbeanstalk:application:environmentsecrets
            OptionName: REB_API_KEY
            Value: !Ref RebApiSecretArn
          - !Ref AWS::NoValue
        - Namespace: aws:elasticbeanstalk:application:environmentsecrets
          OptionName: DB_PASSWORD
          Value: !Ref DatabaseSecret

Outputs:
  ApplicationName:
    Value: !Ref BeanstalkApplication
  EnvironmentName:
    Value: !Ref BeanstalkEnvironment
  ApplicationOriginDomainName:
    Value: !GetAtt BeanstalkEnvironment.EndpointURL
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
  DeploymentBucketName:
    Value: !Ref DeploymentBucket
  VpcId:
    Value: !Ref Vpc
